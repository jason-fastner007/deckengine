[package]
name = "deckengine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Low-latency, real-time-safe two-deck audio engine (playback, DJ mixing, stems, loudness) for Linux and Windows"
license = "AGPL-3.0-or-later"
authors = ["Jason-Marshall Fastner <jasonfastner@protonmail.com>"]
keywords = ["audio", "dj", "low-latency", "realtime", "mixer"]
categories = ["multimedia::audio"]
readme = "README.md"

[lib]
# rlib: use from Rust. cdylib/staticlib: use from C, C++, Kotlin/JVM (JNA/Panama), C#, Python, ...
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["decode", "output"]
# Decode audio files (MP3, AAC/M4A, FLAC, Ogg Vorbis, WAV, ALAC, ...) via symphonia.
decode = ["clip", "symphonia/all", "symphonia/opt-simd"]
# Decode MP3 byte ranges (HTTP Range clips) for analysis only. Small enough for WebAssembly.
clip = ["dep:symphonia", "symphonia/mp3"]
# Open real audio devices. Without it the engine can still render offline.
output = ["dep:cpal"]
# Linux: talk to PipeWire natively instead of through its ALSA plugin.
pipewire = ["output", "cpal/pipewire"]
# Linux: JACK host.
jack = ["output", "cpal/jack"]
# Windows: ASIO host (needs the Steinberg ASIO SDK at build time, see README).
asio = ["output", "cpal/asio"]
# Ask the OS for real-time scheduling of the audio thread on Linux (RTKit / rlimits).
realtime = ["output", "cpal/realtime"]

[dependencies]
cpal = { version = "0.18", optional = true }
ebur128 = "0.1"
realfft = "3"
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, optional = true }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
lto = "thin"
codegen-units = 1
