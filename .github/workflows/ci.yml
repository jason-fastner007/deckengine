name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Feature subsets
        run: |
          cargo check --no-default-features --lib
          cargo check --no-default-features --features decode --lib
          cargo check --no-default-features --features output --lib
      - name: Build C example (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cc -Wall -Wextra -std=c11 examples/c/minimal.c -Iinclude -Ltarget/release -ldeckengine -o minimal

  release-libs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: target/release/libdeckengine.so
          - os: windows-latest
            artifact: target/release/deckengine.dll
          - os: macos-latest
            artifact: target/release/libdeckengine.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: deckengine-${{ runner.os }}
          path: |
            ${{ matrix.artifact }}
            include/deckengine.h
